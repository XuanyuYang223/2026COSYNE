version: '1.3'
date: '2026-10-12'
scope: locked_pilot_V_exploration_then_formal_confirmation
n: 7
pilot_seed: 0
model:
  memory_dim: 128
  control_dim: 32
  readout_dim: 64
candidates:
  A:
    initialization: pytorch_default
optimizer:
  name: Adam
  learning_rate: 0.001
  batch_size: 128
  gradient_clip: 1.0
  weight_decay: 0.0
timings:
  short:
    context: 1
    stimulus: 3
    initial_delay: 0
    rule_cue: 1
    rule_blank: 0
    delays:
    - 0
    final_delay: 0
    query: 1
  mid:
    context: 3
    stimulus: 5
    initial_delay: 2
    rule_cue: 1
    rule_blank: 1
    delays:
    - 0
    final_delay: 2
    query: 3
  original:
    context: 3
    stimulus: 5
    initial_delay: 5
    rule_cue: 1
    rule_blank: 3
    delays:
    - 0
    - 10
    final_delay: 5
    query: 3
stages:
- stage: 1
  timing: short
  max_non_N: 0
  contexts:
  - 0
  max_updates: 20000
- stage: 2
  timing: mid
  max_non_N: 0
  contexts:
  - 0
  - 1
  max_updates: 20000
- stage: 3
  timing: original
  max_non_N: 0
  contexts:
  - 0
  - 1
  max_updates: 20000
- stage: 4
  timing: original
  max_non_N: 1
  contexts:
  - 0
  max_updates: 20000
- stage: 5
  timing: original
  max_non_N: 1
  contexts:
  - 0
  - 1
  max_updates: 20000
- stage: 6
  timing: original
  max_non_N: 2
  contexts:
  - 0
  - 1
  max_updates: 50000
- stage: 7
  timing: original
  max_non_N: 3
  contexts:
  - 0
  - 1
  max_updates: 50000
validation:
  every: 500
  stage_size: 4096
  final_size: 8192
  diagnostic_seed: 20261013
  stage_seed: 20261014
  original_V_reuse: results/validation_trials.npz
  overall_target: 0.97
  factor_target: 0.95
  consecutive_passes: 2
  gate_factors: &id001
  - context
  - true_operation_sequence
  - delay
  - query_type
  - non_N
  diagnostic_batch: 64
  stage7_gate_factors:
  - context
  - delay
  - query_type
  - non_N
  stages1_to6_gate_factors: *id001
scratch:
  permutations: 16
  trials: 224
  max_updates: 2000
  evaluate_every: 100
  target: 0.99
probe:
  alpha: 1.0
  seed: 20261015
  train_contents: 512
execution:
  gpu_hour_budget: 12.0
  cpu_threads: 4
  deterministic: true
  evaluation_batch: 512
formal_max_updates_per_model: 200000
formal_seeds:
- 101
- 102
- 103
- 104
- 105
- 106
scientific_config_source: config.yaml
preserved_datasets: results/v1_1/datasets
evaluation_selection: original_V_only_accuracy_then_CE
pilot_existing_stages_1_to_5_not_retrained: true
pilot_checkpoint: runs/v1_2/candidate_A_seed0/stage_7/best.pt
interventions:
  masks:
  - all
  - rec
  - both
  - three
  mask_source: natural_predictions_saved_before_patching
  native_quality_receiver_unit: condition x d x S x query_type
  native_quality_label_unit: unordered_pair x d x S mean both native directions and
    all queries
  quality_cutoffs:
  - 0.9
  - 0.95
  implementation_tolerances:
    sham_atol: 0
    full_state_logp_atol: 1.0e-05
    full_state_logp_rtol: 1.0e-05
    CPU_uninterrupted_logit_atol: 2.0e-07
    CPU_uninterrupted_logit_rtol: 2.0e-06
prediction_v13:
  primary_label: L_all
  primary_baseline: M0_v13
  primary_model: M_CKA_v13
  D_input: G mean native normalized squared distance of initial one-hot matrices
  sensitivity_labels:
  - L_rec
  - L_both
  ridge_alpha: 1
  bootstrap_replicates: 1000
  quality_report_only: true
  missing_target_rule: exclude undefined masked target from fitting/scoring only;
    retain row and count
